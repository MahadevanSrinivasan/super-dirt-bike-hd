<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Super Dirt Bike HD: Motocross &amp; Trials (1080p 60fps)</title>
  <style>
    :root {
      --bg-dark: #090d16;
      --accent: #f97316;
      --accent-glow: rgba(249, 115, 22, 0.45);
      --gold: #facc15;
      --emerald: #10b981;
      --cyan: #38bdf8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 18%, #1e293b 0%, #090d16 75%);
      color: #f8fafc;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #app-shell {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #topbar {
      width: min(96vw, calc(88vh * 16 / 9));
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 14px;
      margin-bottom: 6px;
      background: rgba(15, 23, 42, 0.86);
      border: 1px solid rgba(249, 115, 22, 0.35);
      border-radius: 12px;
      backdrop-filter: blur(10px);
      font-size: 13px;
      z-index: 10;
      flex-wrap: wrap;
      gap: 8px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--gold);
      text-shadow: 0 2px 8px rgba(250, 204, 21, 0.35);
    }
    .badge {
      background: linear-gradient(135deg, #f97316, #dc2626);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 999px;
      box-shadow: 0 0 10px var(--accent-glow);
    }
    .controls-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .btn {
      background: rgba(30, 41, 59, 0.9);
      color: #e2e8f0;
      border: 1px solid rgba(148, 163, 184, 0.35);
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn:hover {
      border-color: var(--gold);
      color: #fff;
      transform: translateY(-1px);
    }
    .btn.active {
      background: linear-gradient(135deg, #ea580c, #c2410c);
      border-color: #fdba74;
      color: #fff;
    }
    #canvas-wrap {
      position: relative;
      width: min(96vw, calc(86vh * 16 / 9));
      aspect-ratio: 16 / 9;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 55px rgba(0, 0, 0, 0.78), 0 0 0 2px rgba(249, 115, 22, 0.35);
      background: #000;
      touch-action: none;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }
    /* Optional Virtual Arcade Buttons Overlay */
    #touch-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: none;
      justify-content: space-between;
      align-items: flex-end;
      padding: 18px 22px;
      z-index: 6;
    }
    #touch-overlay.visible {
      display: flex;
    }
    .pad-cluster {
      display: flex;
      gap: 10px;
      pointer-events: auto;
      align-items: center;
    }
    .tbtn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.72);
      border: 2px solid rgba(248, 250, 252, 0.45);
      color: #fff;
      font-weight: 800;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      touch-action: none;
    }
    .tbtn.gas {
      width: 76px;
      height: 76px;
      background: rgba(22, 163, 74, 0.78);
      border-color: #86efac;
    }
    .tbtn.turbo {
      width: 70px;
      height: 70px;
      background: rgba(234, 88, 12, 0.82);
      border-color: #fdba74;
    }
    .tbtn.pressed {
      transform: scale(0.92);
      filter: brightness(1.25);
    }
    @media (max-width: 900px) {
      #topbar {
        width: 98vw;
        padding: 4px 8px;
        font-size: 11px;
      }
      #canvas-wrap {
        width: 98vw;
        border-radius: 10px;
      }
    }
  </style>
</head>
<body>
  <div id="app-shell">
    <div id="topbar">
      <div class="brand">
        <span>🏍️ SUPER DIRT BIKE HD</span>
        <span class="badge">1080p 60FPS</span>
        <span style="color:#94a3b8;font-weight:600;">Trials Physics + Excitebike Stadium + Track Builder</span>
      </div>
      <div class="controls-bar">
        <button id="btn-mode-trials" class="btn active" title="Physics Stunt & Obstacle Trials Mode">⛰️ Trials Mode</button>
        <button id="btn-mode-stadium" class="btn" title="Excitebike 4-Lane Turbo Motocross">🏁 Stadium GP</button>
        <button id="btn-mode-editor" class="btn" title="Build & Race Your Own Custom Dirt Track">🛠️ Track Builder</button>
        <button id="btn-prev-track" class="btn">◀ Track</button>
        <button id="btn-next-track" class="btn">Track ▶</button>
        <button id="btn-touch-mode" class="btn">📱 Touch: SCREEN</button>
        <button id="btn-tilt" class="btn">📐 Tilt: OFF</button>
        <button id="btn-mute" class="btn">🔊 Audio: ON</button>
        <button id="btn-fullscreen" class="btn">⛶ Fullscreen</button>
      </div>
    </div>

    <div id="canvas-wrap">
      <canvas id="game" width="1920" height="1080"></canvas>
      <div id="touch-overlay">
        <div class="pad-cluster">
          <div class="tbtn" data-act="left">↺<span style="font-size:10px">LEAN L</span></div>
          <div class="tbtn" data-act="right">↻<span style="font-size:10px">LEAN R</span></div>
          <div class="tbtn" data-act="up">▲<span style="font-size:10px">LANE+</span></div>
          <div class="tbtn" data-act="down">▼<span style="font-size:10px">LANE-</span></div>
        </div>
        <div class="pad-cluster">
          <div class="tbtn" data-act="brake">🛑<span style="font-size:10px">BRAKE</span></div>
          <div class="tbtn turbo" data-act="turbo">🔥<span style="font-size:10px">TURBO</span></div>
          <div class="tbtn gas" data-act="gas">⚡<span style="font-size:10px">GAS</span></div>
        </div>
      </div>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
