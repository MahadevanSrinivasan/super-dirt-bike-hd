<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Excitebike (Classic 1984 NES 8-Bit Edition)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #080808;
      color: #fcfcfc;
      font-family: 'Courier New', monospace;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #app-shell {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #topbar {
      width: min(96vw, calc(88vh * 4 / 3));
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 12px;
      margin-bottom: 6px;
      background: #141414;
      border: 2px solid #d82800;
      font-size: 13px;
      font-weight: bold;
      gap: 6px;
      flex-wrap: wrap;
    }
    .brand {
      color: #fcfcfc;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .nes-tag {
      background: #d82800;
      color: #fcfcfc;
      padding: 2px 6px;
      font-size: 11px;
    }
    .controls-bar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .btn {
      background: #242424;
      color: #fcfcfc;
      border: 2px solid #7c7c7c;
      padding: 4px 8px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn:hover, .btn.active {
      background: #d82800;
      border-color: #fcfcfc;
    }
    #canvas-wrap {
      position: relative;
      width: min(96vw, calc(85vh * 4 / 3));
      aspect-ratio: 4 / 3;
      border: 4px solid #383838;
      background: #000;
      overflow: hidden;
      touch-action: none;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-crisp-edges;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      touch-action: none;
    }
    #touch-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: none;
      justify-content: space-between;
      align-items: flex-end;
      padding: 14px 18px;
      z-index: 6;
    }
    #touch-overlay.visible {
      display: flex;
    }
    .pad-cluster {
      display: flex;
      gap: 8px;
      pointer-events: auto;
      align-items: center;
    }
    .tbtn {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: rgba(20, 20, 20, 0.78);
      border: 2px solid #fcfcfc;
      color: #fcfcfc;
      font-weight: bold;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }
    .tbtn.b-btn {
      width: 66px;
      height: 66px;
      background: rgba(216, 40, 0, 0.85);
    }
    .tbtn.a-btn {
      width: 66px;
      height: 66px;
      background: rgba(0, 168, 0, 0.85);
    }
    .tbtn.pressed {
      transform: scale(0.92);
      filter: brightness(1.3);
    }
  </style>
</head>
<body>
  <div id="app-shell">
    <div id="topbar">
      <div class="brand">
        <span class="nes-tag">NES 1984</span>
        <span>EXCITEBIKE (ORIGINAL 8-BIT PIXEL EDITION)</span>
      </div>
      <div class="controls-bar">
        <button id="btn-sel-a" class="btn active">1. SELECTION A</button>
        <button id="btn-sel-b" class="btn">2. SELECTION B (RIVALS)</button>
        <button id="btn-design" class="btn">3. DESIGN TRACK</button>
        <button id="btn-track" class="btn">TRACK 1</button>
        <button id="btn-touch" class="btn">TOUCH: SCREEN</button>
        <button id="btn-tilt" class="btn">TILT: OFF</button>
        <button id="btn-mute" class="btn">AUDIO: ON</button>
        <button id="btn-fs" class="btn">FULLSCREEN</button>
      </div>
    </div>

    <div id="canvas-wrap">
      <canvas id="game" width="320" height="240"></canvas>
      <div id="touch-overlay">
        <div class="pad-cluster">
          <div class="tbtn" data-act="left">◀<span style="font-size:9px">TILT UP</span></div>
          <div class="tbtn" data-act="right">▶<span style="font-size:9px">TILT DN</span></div>
          <div class="tbtn" data-act="up">▲<span style="font-size:9px">LANE ▲</span></div>
          <div class="tbtn" data-act="down">▼<span style="font-size:9px">LANE ▼</span></div>
        </div>
        <div class="pad-cluster">
          <div class="tbtn b-btn" data-act="turbo">B<span style="font-size:9px">TURBO</span></div>
          <div class="tbtn a-btn" data-act="gas">A<span style="font-size:9px">GAS</span></div>
        </div>
      </div>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
